<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ضيوف مجلسنا</title>
<style>
  @font-face { font-family: "Kufi"; font-weight: 200; src: url(/assets/kufi-200.woff2) format("woff2"); }
  @font-face { font-family: "Kufi"; font-weight: 400; src: url(/assets/kufi-400.woff2) format("woff2"); }
  @font-face { font-family: "Kufi"; font-weight: 600; src: url(/assets/kufi-600.woff2) format("woff2"); }
  :root { --bg: #0b1020; --bg2: #141c36; --card: rgba(255, 236, 200, .05); --card-b: rgba(232, 196, 128, .16); --gold: #dcb56a; --gold-l: #f2dba3; --cream: #f4efe4; --muted: rgba(244, 239, 228, .62); --ok: #7fd3a1; --danger: #ec8b74; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: radial-gradient(130% 70% at 50% 0%, #26355f, var(--bg) 60%); color: var(--cream); font-family: "Kufi", system-ui, sans-serif; min-height: 100%; }
  body { padding: calc(14px + var(--safe-t)) 16px calc(40px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 20px 0 10px; }
  header img { width: 86px; height: 86px; border-radius: 24px; box-shadow: 0 14px 36px rgba(0, 0, 0, .55); }
  header h1 { margin: 14px 0 2px; font-weight: 200; font-size: 34px; color: var(--gold-l); line-height: 1.2; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .ttl { margin: 22px 4px 8px; font-size: 13px; letter-spacing: .5px; color: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--card-b); border-radius: 20px; padding: 16px; margin-bottom: 12px; backdrop-filter: blur(10px); }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  input, textarea { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--card-b); background: rgba(0, 0, 0, .28); color: var(--cream); font: inherit; font-size: 16px; outline: none; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--gold); }
  label.f { display: block; margin: 12px 2px 6px; font-size: 12.5px; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 15px; font: inherit; font-weight: 600; font-size: 15.5px; color: #1b2440; background: linear-gradient(135deg, #f1d99f, #cf9f55); box-shadow: 0 8px 22px rgba(207, 159, 85, .22); }
  .btn.ghost { background: rgba(0, 0, 0, .2); color: var(--gold-l); border: 1px solid var(--card-b); box-shadow: none; font-weight: 400; }
  .btn:active { transform: scale(.98); }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mi { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px; border-radius: 16px; border: 1px solid var(--card-b); background: rgba(0, 0, 0, .2); color: var(--cream); font: inherit; font-size: 15px; text-align: center; transition: background .2s, border-color .2s; }
  .mi i { font-style: normal; font-size: 30px; }
  .mi small { color: var(--muted); font-size: 11.5px; }
  .mi.sent { border-color: var(--ok); background: rgba(127, 211, 161, .12); }
  .wifi { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px dashed var(--card-b); font-size: 15px; }
  .wifi:last-child { border-bottom: 0; }
  .wifi b { font-weight: 400; color: var(--gold-l); direction: ltr; unicode-bidi: isolate; }
  .svc { display: flex; gap: 10px; padding: 9px 2px; font-size: 14.5px; }
  .svc span { color: var(--gold); flex: 0 0 90px; }
  .toast { position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translate(-50%, -160%); padding: 11px 20px; border-radius: 30px; background: rgba(20, 28, 54, .96); border: 1px solid var(--gold); color: var(--gold-l); font-size: 14px; white-space: nowrap; z-index: 9; transition: transform .35s cubic-bezier(.2, 1.2, .4, 1); box-shadow: 0 12px 30px rgba(0, 0, 0, .5); }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { border-color: var(--danger); color: #ffc0b0; }
  footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 26px; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header>
  <img src="/assets/icon-180.png" alt="">
  <h1 id="welcome">حبابكم عشرة</h1>
  <p id="name">مجلسنا</p>
</header>

<div class="ttl">اسمك (اختياري)</div>
<div class="card"><input id="guest" type="text" maxlength="40" placeholder="مثل: أبو أحمد"></div>

<div class="ttl">الضيافة · اضغط على ما تحب ويصل الطلب لأهل البيت بهدوء</div>
<div class="card">
  <div class="menu" id="menu"></div>
  <p id="menuNote" style="margin:12px 0 0;text-align:center"></p>
  <label class="f">أو اكتب طلبك</label>
  <input id="reqText" type="text" maxlength="120" placeholder="مثل: ماء بارد لو سمحتم">
  <button class="btn ghost" id="sendReq">أرسل الطلب</button>
</div>

<div class="ttl">اترك تحية أو دعاء</div>
<div class="card">
  <p>تظهر على شاشة المجلس وتُحفظ في سجل الزيارات</p>
  <textarea id="noteText" maxlength="120" placeholder="بارك الله فيكم وفي داركم"></textarea>
  <button class="btn" id="sendNote">أرسل التحية</button>
</div>

<div id="wifiWrap" style="display:none">
  <div class="ttl">واي فاي الضيوف</div>
  <div class="card">
    <div class="wifi"><span>الشبكة</span><b id="ssid"></b></div>
    <div class="wifi" id="passRow"><span>كلمة المرور</span><b id="pass"></b></div>
    <button class="btn ghost" id="copyPass">انسخ كلمة المرور</button>
  </div>
</div>

<div id="svcWrap" style="display:none">
  <div class="ttl">في البيت</div>
  <div class="card" id="svc"></div>
</div>

<footer>مجلسنا · كل شيء داخل البيت، بدون حسابات ولا إنترنت خارجي</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ICONS = [["قهوة", "☕"], ["جبنة", "☕"], ["شاي", "🍵"], ["كركدي", "🧉"], ["عصير", "🧃"], ["ماء", "💧"], ["تمر", "🌴"], ["حلو", "🍬"], ["كيك", "🍰"], ["فطور", "🍳"], ["غداء", "🍽️"], ["عشاء", "🍽️"], ["فول", "🥘"], ["طعمية", "🧆"], ["بسكويت", "🍪"], ["فاكهة", "🍎"], ["آيس", "🍨"]];
  function icon(n) { for (var i = 0; i < ICONS.length; i++) if (n.indexOf(ICONS[i][0]) !== -1) return ICONS[i][1]; return "✦"; }
  function say(t, err) { var m = $("toast"); m.textContent = t; m.className = "toast show" + (err ? " err" : ""); clearTimeout(say.t); say.t = setTimeout(function () { m.className = "toast"; }, 2200); }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 10); }
  try { $("guest").value = localStorage.getItem("guestName") || ""; } catch (e) {}
  $("guest").onchange = function () { try { localStorage.setItem("guestName", $("guest").value); } catch (e) {} };

  function send(type, text, done) {
    fetch("/api/guest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: type, text: text, name: $("guest").value.trim() }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "صار خطأ"); done(); }); })
      .catch(function (e) { say(e.message, true); });
  }
  function load() {
    fetch("/api/guest").then(function (r) { return r.json(); }).then(function (d) {
      $("welcome").textContent = d.welcome || "حبابكم عشرة";
      $("name").textContent = d.majlisName || "مجلسنا";
      document.title = "ضيوف " + (d.majlisName || "مجلسنا");
      var menu = d.menu || [];
      $("menu").innerHTML = menu.map(function (it, i) {
        var n = typeof it === "string" ? it : it.name, note = typeof it === "string" ? "" : it.note;
        return '<button class="mi" data-i="' + i + '"><i>' + icon(n) + "</i><span></span>" + (note ? "<small></small>" : "") + "</button>";
      }).join("");
      Array.prototype.forEach.call($("menu").children, function (b, i) {
        var it = menu[i], n = typeof it === "string" ? it : it.name, note = typeof it === "string" ? "" : it.note;
        b.querySelector("span").textContent = n; if (note) b.querySelector("small").textContent = note;
        b.onclick = function () { buzz(); send("request", n, function () { b.classList.add("sent"); say("وصل طلبك ✓"); buzz(20); setTimeout(function () { b.classList.remove("sent"); }, 4000); }); };
      });
      $("menuNote").textContent = d.menuNote || "";
      if (!menu.length) $("menu").innerHTML = '<p style="grid-column:1/-1;text-align:center">اكتب طلبك في الخانة تحت</p>';
      var w = d.wifi || {};
      if (w.ssid) { $("wifiWrap").style.display = ""; $("ssid").textContent = w.ssid; $("pass").textContent = w.pass || "بدون كلمة مرور"; $("passRow").style.display = ""; $("copyPass").style.display = w.pass ? "" : "none"; }
      var s = d.services || {}, lines = "";
      if (s.wc) lines += '<div class="svc"><span>دورة المياه</span><div></div></div>';
      if (s.prayerRoom) lines += '<div class="svc"><span>المصلى</span><div></div></div>';
      if (s.note) lines += '<div class="svc"><span>ملاحظة</span><div></div></div>';
      if (lines) {
        $("svcWrap").style.display = ""; $("svc").innerHTML = lines;
        var vals = [s.wc, s.prayerRoom, s.note].filter(Boolean), divs = $("svc").querySelectorAll("div > div");
        Array.prototype.forEach.call(divs, function (d, i) { d.textContent = vals[i]; });
      }
    }).catch(function () { say("تعذر الاتصال بالتلفاز", true); });
  }
  $("sendReq").onclick = function () { var t = $("reqText").value.trim(); if (!t) { say("اكتب الطلب", true); return; } buzz(); send("request", t, function () { $("reqText").value = ""; say("وصل طلبك ✓"); buzz(20); }); };
  $("sendNote").onclick = function () { var t = $("noteText").value.trim(); if (!t) { say("اكتب التحية", true); return; } buzz(); send("note", t, function () { $("noteText").value = ""; say("وصلت تحيتك، شكراً لكم ✓"); buzz(20); }); };
  $("copyPass").onclick = function () { var t = $("pass").textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { say("تم النسخ ✓"); }, function () { say(t); }); };
  load();
})();
</script>
</body>
</html>
